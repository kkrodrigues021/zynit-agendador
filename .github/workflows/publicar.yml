name: Publicar no Instagram

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Publicar itens vencidos
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python publicar.py
      - name: Salvar status da fila
        run: |
          if ! git diff --quiet fila.json; then
            git config user.name "agendador"
            git config user.email "agendador@users.noreply.github.com"
            git add fila.json
            git commit -m "Atualiza status da fila"
            git push
          fi
