name: Publicar no Instagram

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Baixar o conteúdo (repositório privado)
        uses: actions/checkout@v4
        with:
          repository: kkrodrigues021/zynit-conteudo
          token: ${{ secrets.CONTEUDO_TOKEN }}
          path: conteudo
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Publicar itens vencidos
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
          CONTEUDO_DIR: conteudo
        run: python publicar.py
      - name: Salvar status da fila
        run: |
          git -C conteudo config user.name "agendador"
          git -C conteudo config user.email "agendador@users.noreply.github.com"
          python salvar_fila.py conteudo
